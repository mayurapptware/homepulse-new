<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)" stroke="#fff" stroke-width="4"/>
  
  <!-- Microphone icon -->
  <g transform="translate(64, 64)">
    <!-- Microphone body -->
    <rect x="-8" y="-20" width="16" height="32" rx="8" fill="#fff"/>
    
    <!-- Microphone stand -->
    <rect x="-2" y="12" width="4" height="16" fill="#fff"/>
    
    <!-- Base -->
    <rect x="-12" y="28" width="24" height="4" rx="2" fill="#fff"/>
    
    <!-- Sound waves -->
    <g opacity="0.7">
      <path d="M 20 -10 Q 30 -10 30 0 Q 30 10 20 10" stroke="#fff" stroke-width="2" fill="none"/>
      <path d="M 25 -15 Q 40 -15 40 0 Q 40 15 25 15" stroke="#fff" stroke-width="2" fill="none"/>
      <path d="M 30 -20 Q 50 -20 50 0 Q 50 20 30 20" stroke="#fff" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>