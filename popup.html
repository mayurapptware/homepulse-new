<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin: 0;
    }
    
    .container {
      text-align: center;
    }
    
    h1 {
      margin: 0 0 20px 0;
      font-size: 18px;
      font-weight: 600;
    }
    
    .status {
      margin: 15px 0;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }
    
    .recording {
      background: rgba(255, 59, 48, 0.3);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }
    
    button {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      margin: 5px;
      backdrop-filter: blur(10px);
    }
    
    button:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .record-btn {
      background: rgba(255, 59, 48, 0.8);
      border-color: rgba(255, 59, 48, 0.8);
    }
    
    .record-btn:hover {
      background: rgba(255, 59, 48, 1);
    }
    
    .stop-btn {
      background: rgba(255, 149, 0, 0.8);
      border-color: rgba(255, 149, 0, 0.8);
    }
    
    .stop-btn:hover {
      background: rgba(255, 149, 0, 1);
    }
    
    .download-btn {
      background: rgba(52, 199, 89, 0.8);
      border-color: rgba(52, 199, 89, 0.8);
    }
    
    .download-btn:hover {
      background: rgba(52, 199, 89, 1);
    }
    
    .info {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 15px;
      line-height: 1.4;
    }
    
    .recording-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ff3b30;
      border-radius: 50%;
      margin-right: 8px;
      animation: blink 1s infinite;
    }
    
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ Call Recorder</h1>
    
    <div id="status" class="status">
      Ready to record
    </div>
    
    <div>
      <button id="recordBtn" class="record-btn">Start Recording</button>
      <button id="stopBtn" class="stop-btn" disabled>Stop Recording</button>
    </div>
    
    <div>
      <button id="downloadBtn" class="download-btn" disabled>Download MP3</button>
    </div>
    
    <div class="info">
      <p>Click "Start Recording" to begin capturing audio from the current tab. The recording will be saved as an MP3 file.</p>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
